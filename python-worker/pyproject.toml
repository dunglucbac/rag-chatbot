[tool.poetry]
name = "python-worker"
version = "0.1.0"
description = "File processing worker for receipt intelligence"
authors = ["Thomas Luu"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
python-dotenv = "^1.0.0"
pika = "^1.3.2"
docling = "^2.126.0"
Pillow = "^11.1.0"
pillow-heif = "^1.3.0"
anthropic = "^0.102.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
reportlab = "^4.0.0"
matplotlib = "^3.10.9"
jupyter = "^1.1.1"
ipywidgets = "^8.1.8"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
